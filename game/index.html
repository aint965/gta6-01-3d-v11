<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palkon Auto — The Solmar Story</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #142d38; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .panel {
    position: fixed; z-index: 5; color: #ead8b2;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: rgba(20, 45, 56, 0.72); border: 1px solid rgba(234, 216, 178, 0.35);
    border-radius: 8px; padding: 8px 12px; backdrop-filter: blur(2px);
  }
  #hud-top { top: 14px; left: 14px; }
  #hud-title { font-size: 22px; font-weight: 800; letter-spacing: 3px; color: #ead8b2; }
  #hud-sub { font-size: 11px; letter-spacing: 2px; color: #d77f69; text-transform: uppercase; }
  #hud-district { font-size: 15px; font-weight: 600; margin-top: 4px; }
  #hud-clock { font-size: 13px; color: #7fb3c8; }
  #hud-preset { font-size: 12px; color: #ead8b2; }
  #hud-fps { position: fixed; top: 14px; right: 14px; z-index: 5; font-size: 12px; }
  #minimap-wrap { position: fixed; right: 14px; top: 52px; z-index: 5; }
  #minimap { display: block; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.45); }
  #hud-help {
    bottom: 14px; left: 14px; font-size: 12px; line-height: 1.6; color: #c9d6d2;
  }
  #hud-help b { color: #ead8b2; }
  #hud-speed {
    bottom: 14px; right: 14px; font-size: 22px; font-weight: 800; letter-spacing: 1px;
  }
  #hud-cash { font-size: 14px; font-weight: 700; color: #7fb3c8; margin-top: 2px; }
  #hud-mission {
    top: 14px; left: 50%; transform: translateX(-50%); font-size: 14px; font-weight: 600;
    max-width: 46vw; text-align: center;
  }
  #hud-banner {
    top: 34%; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: 800;
    letter-spacing: 0.5px; text-align: center; max-width: 60vw;
  }
  #hud-prompt {
    bottom: 64px; left: 50%; transform: translateX(-50%); font-size: 14px; font-weight: 600;
  }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Palkon Auto: an open-world crime game in the coastal city of Solmar"></canvas>
<div id="hud-top" class="panel">
  <div id="hud-title">PALKON AUTO</div>
  <div id="hud-sub">The Solmar Story</div>
  <div id="hud-district">Canal Ward</div>
  <div><span id="hud-clock">12:00</span> &middot; <span id="hud-preset">Midday</span></div>
  <div id="hud-cash">Cash $0</div>
</div>
<div id="hud-mission" class="panel"></div>
<div id="hud-banner" class="panel"></div>
<div id="hud-fps" class="panel">-- FPS</div>
<div id="minimap-wrap"><canvas id="minimap" width="220" height="198"></canvas></div>
<div id="hud-help" class="panel">
  <b>WASD</b> move / drive &nbsp; <b>Drag</b> look &nbsp; <b>Wheel</b> zoom<br>
  <b>E</b> get in / out of a car &nbsp; <b>H</b> headlights &nbsp; <b>M</b> start mission<br>
  <b>Q</b> interact &nbsp; <b>X</b> drop cargo &nbsp; <b>1 / 2 / 3</b> midday / sunset / night &nbsp; <b>T</b> cycle light
</div>
<div id="hud-speed" class="panel"></div>
<div id="hud-prompt" class="panel"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
